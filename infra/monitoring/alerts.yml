# Alert rules, evaluated by Prometheus. Firing alerts show at http://127.0.0.1:9090/alerts
# and in Grafana under Alerting > Alert rules (data source-managed).
groups:
  - name: availability
    rules:
      - alert: ServiceDown
        expr: up{job=~"users|game|postgres"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} is not answering scrapes"
          description: "Prometheus could not scrape {{ $labels.instance }} (job {{ $labels.job }}) for 1 minute."

      - alert: PostgresDown
        expr: pg_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL is unreachable"
          description: "postgres-exporter is running but cannot connect to the database."

  - name: users
    rules:
      - alert: UsersHigh5xxRate
        expr: |
          sum(rate(http_requests_total{job="users",status=~"5.."}[5m]))
            / clamp_min(sum(rate(http_requests_total{job="users"}[5m])), 1e-9) > 0.05
          and sum(rate(http_requests_total{job="users"}[5m])) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "users service: more than 5% of requests fail with 5xx"
          description: "5xx ratio is {{ $value | humanizePercentage }} over the last 5 minutes."

      - alert: UsersSlowRequests
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{job="users"}[5m]))) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "users service: p95 latency above 1 s"
          description: "p95 request duration is {{ $value | humanizeDuration }}."

  - name: game
    rules:
      # One tick at 60 Hz has a budget of ~16.7 ms; p99 above 10 ms leaves little headroom.
      - alert: GameTickTooSlow
        expr: |
          histogram_quantile(0.99, sum by (le) (rate(game_tick_duration_seconds_bucket{job="game"}[5m]))) > 0.010
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "game tick p99 above 10 ms (budget 16.7 ms at 60 Hz)"
          description: "p99 tick duration is {{ $value | humanizeDuration }}."

      - alert: GameResultsDropped
        expr: increase(game_result_reports_failed_total[15m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "game could not store {{ $labels.kind }} results in the users service"
          description: "{{ $value }} result(s) were dropped or rejected in the last 15 minutes."

  - name: postgres
    rules:
      - alert: PostgresTooManyConnections
        expr: |
          sum(pg_stat_activity_count) / scalar(max(pg_settings_max_connections)) > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL above 80% of max_connections"
          description: "{{ $value | humanizePercentage }} of max_connections are in use."
