# Prometheus for ft_transcendence (compose profile "monitoring").
# Every target is scraped over the internal Docker network; none of these ports is published
# and Caddy never routes /metrics.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: users
    static_configs:
      - targets: ["users:4000"]

  - job_name: game
    static_configs:
      - targets: ["game:3001"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
