# ft_transcendence — one command: `make up` (docker compose -f infra/docker-compose.yml up -d --build)
# Browser origin: https://localhost:8443 (Caddy, automatic HTTPS). Only Caddy publishes a public
# port; the optional "monitoring" profile binds Grafana and Prometheus to 127.0.0.1 only.
name: ft_transcendence

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ft}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/.env}
      POSTGRES_DB: ${POSTGRES_DB:-ft}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [internal]
    restart: unless-stopped

  users:
    build:
      context: ..
      dockerfile: services/users/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ft}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ft}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-https://localhost:8443}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in infra/.env}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?set INTERNAL_SERVICE_TOKEN in infra/.env}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-ft_transcendence <no-reply@localhost>}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-5-5}
      SEED_DEV_DATA: ${SEED_DEV_DATA:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - uploads:/usr/src/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]
    restart: unless-stopped

  game:
    build:
      context: ..
      dockerfile: services/game/Dockerfile
    environment:
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-https://localhost:8443}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      USERS_API_URL: http://users:4000
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      users:
        condition: service_healthy
    networks: [internal]
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    depends_on:
      users:
        condition: service_healthy
    networks: [internal]
    restart: unless-stopped

  # Local mail catcher (profile "mail", enabled by `make env`): every email the users
  # service sends lands in the inbox at http://localhost:8025 (bound to this machine only).
  mailpit:
    image: axllent/mailpit:v1.27
    profiles: [mail]
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"
    networks: [internal]
    restart: unless-stopped

  # Scheduled backups (database dump + uploaded avatars) into ../backups on the host.
  # Restore: make restore DB=db-<stamp>.dump [UPLOADS=uploads-<stamp>.tar.gz]
  backup:
    image: postgres:17-alpine
    entrypoint: ["/backup/loop.sh"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ft}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-ft}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-7}
    volumes:
      - ./backup:/backup:ro
      - ../backups:/backups
      - uploads:/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]
    restart: unless-stopped

  caddy:
    image: caddy:2.11-alpine
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost:8443}
      TLS_MODE: ${TLS_MODE:-internal}
      HSTS_HEADER: ${HSTS_HEADER:--Strict-Transport-Security}
    ports:
      # HTTPS (8443 locally, 443 on a real domain) and HTTP for ACME challenges / redirects
      - "${HTTPS_PORT:-8443}:${CADDY_HTTPS_PORT:-8443}"
      - "${HTTP_PORT:-18080}:80"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_started
      users:
        condition: service_healthy
      game:
        condition: service_started
    networks: [internal]
    restart: unless-stopped

  # ---- Monitoring (opt-in): COMPOSE_PROFILES=monitoring or `--profile monitoring`.
  # Prometheus scrapes users:4000/metrics, game:3001/metrics and postgres-exporter over the
  # internal network (Caddy never routes /metrics). See README > Operations > Monitoring.
  prometheus:
    image: prom/prometheus:v3.15.1
    profiles: [monitoring]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
      - --storage.tsdb.retention.size=2GB
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    ports:
      # UI (targets, alerts) for the host only
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    networks: [internal]
    restart: unless-stopped

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1
    profiles: [monitoring]
    environment:
      DATA_SOURCE_URI: postgres:5432/${POSTGRES_DB:-ft}?sslmode=disable
      DATA_SOURCE_USER: ${POSTGRES_USER:-ft}
      DATA_SOURCE_PASS: ${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.1.10
    profiles: [monitoring]
    # Refuse to start without an admin password (Grafana would fall back to admin/admin)
    entrypoint:
      - /bin/sh
      - -c
      - '[ -n "$$GF_SECURITY_ADMIN_PASSWORD" ] || { echo "set GRAFANA_ADMIN_PASSWORD in infra/.env" >&2; exit 1; }; exec /run.sh'
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_SECURITY_COOKIE_SAMESITE: strict
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_ALLOW_ORG_CREATE: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_SERVER_ROOT_URL: http://localhost:${GRAFANA_PORT:-3002}/
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/ft-overview.json
    volumes:
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3002}:3000"
    depends_on:
      - prometheus
    networks: [internal]
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
  prometheus_data:
  grafana_data:

networks:
  internal:
