services:
  frontend:
    container_name: frontend
    image: frontend
    build:
      args:
        PORT: ${FRONTEND_PORT:-3000}
      context: ../services/frontend/
      dockerfile: Dockerfile
    command: ["${FRONTEND_CMD:-dev}"]
    volumes:
      - ../services/frontend/:/usr/src/app/:rw
      - ../services/shared/:/usr/src/shared/
      - frontend_node_modules:/usr/src/app/node_modules/
    networks:
      - devnet
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS ${FRONTEND_PORT:-3000} || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  users:
    container_name: users
    image: users
    build:
      args:
        PORT: ${USERS_PORT:-4000}
      context: ../services/users/
      dockerfile: Dockerfile
    env_file:
      - .env
    volumes:
      - ../services/users/:/usr/src/app/:rw
      - users_db:/usr/src/app/db/
      - users_node_modules:/usr/src/app/node_modules/
    networks:
      - devnet
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS ${USERS_PORT:-4000} || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  game:
    build:
      context: ../services/game/
      args:
        PORT: ${GAME_PORT:-3001}
    image: game
    container_name: game
    command: ["${GAME_CMD:-dev}"]
    networks:
      - devnet
    volumes:
      - ../services/game:/usr/src/app:rw
      - ../services/shared/:/usr/src/shared/:rw
      - game_node_modules:/usr/src/app/node_modules/
    restart: unless-stopped

  api-gateway:
    container_name: api-gateway
    image: api-gateway
    build:
      args:
        PORT: ${API_GATEWAY_PORT:-443}
        USERS_PORT: ${USERS_PORT:-4000}
        FRONTEND_PORT: ${FRONTEND_PORT:-3000}
        GAME_PORT: ${GAME_PORT:-3001}
      context: ../services/api-gateway
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "${API_GATEWAY_PORT:-443}:443"
    volumes:
      - ../services/api-gateway/server.crt:/etc/nginx/ssl/server.crt:ro
      - ../services/api-gateway/server.key:/etc/nginx/ssl/server.key:ro
    networks:
      - devnet
    depends_on:
      - frontend
      - users
    healthcheck:
      test: ["CMD-SHELL", "curl -k -fsS ${API_GATEWAY_PORT:-443} || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  frontend_node_modules:
  users_db:
  users_node_modules:
  game_node_modules:

networks:
  devnet:
    driver: bridge
