services:
  frontend:
    container_name: frontend
    image: frontend
    build:
      context: ../services/frontend/
      dockerfile: Dockerfile
    command: ["${FRONTEND_CMD:-dev}"]
    ports:
      - "${FRONTEND_PORT}:${FRONTEND_PORT}"
    volumes:
      - ../services/frontend/:/usr/src/app/:rw
      - frontend_node_modules:/usr/src/app/node_modules/
    networks:
      - devnet
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS ${FRONTEND_HEALTH_HOST} || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  users:
    container_name: users
    image: users
    build:
      context: ../services/users/
      dockerfile: Dockerfile
    env_file:
      - .env
    volumes:
      - ../services/users/:/usr/src/app/:rw
      - users_db:/usr/src/app/db/
      - users_node_modules:/usr/src/app/node_modules/
    networks:
      - devnet
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS ${USERS_HEALTH_HOST} || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  api-gateway:
    container_name: api-gateway
    image: api-gateway
    build:
      context: ../services/api-gateway
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "${API_GATEWAY_PORT}:443"
    volumes:
      - ../services/api-gateway/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../services/api-gateway/server.crt:/etc/nginx/ssl/server.crt:ro
      - ../services/api-gateway/server.key:/etc/nginx/ssl/server.key:ro
    networks:
      - devnet
    healthcheck:
      test: ["CMD-SHELL", "curl -k -fsS ${API_GATEWAY_HEALTH_HOST} || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  frontend_node_modules:
  users_db:
  users_node_modules:

networks:
  devnet:
    driver: bridge
