# VOLLEY.EXE (repo ft_transcendence) — one command: `make up` (docker compose -f infra/docker-compose.yml up -d --build)
# Browser origin: https://localhost:47443 (Caddy, automatic HTTPS). Only Caddy publishes a public
# port; the optional "mail" profile binds Mailpit to 127.0.0.1 only. Host ports are all 47xxx.
name: volley

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ft}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/.env}
      POSTGRES_DB: ${POSTGRES_DB:-ft}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # dev only: reachable from this machine (pgAdmin, psql) on 127.0.0.1:47432, never from the
    # network; docker-compose.prod.yml removes it
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-47432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [internal]
    restart: unless-stopped

  users:
    build:
      context: ..
      dockerfile: services/users/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ft}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ft}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-https://localhost:47443}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in infra/.env}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?set INTERNAL_SERVICE_TOKEN in infra/.env}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-VOLLEY.EXE <no-reply@localhost>}
      REQUIRE_EMAIL_VERIFICATION: ${REQUIRE_EMAIL_VERIFICATION:-true}
      # Bot check on sign-up/sign-in/reset (Cloudflare Turnstile); both empty = off
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      # Coach: an OpenAI-compatible chat API (local Ollama by default, or a remote provider); empty = off
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      SEED_DEV_DATA: ${SEED_DEV_DATA:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - uploads:/usr/src/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]
    restart: unless-stopped

  game:
    build:
      context: ..
      dockerfile: services/game/Dockerfile
    environment:
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-https://localhost:47443}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      USERS_API_URL: http://users:4000
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      users:
        condition: service_healthy
    networks: [internal]
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    depends_on:
      users:
        condition: service_healthy
    networks: [internal]
    restart: unless-stopped

  # Local mail catcher (profile "mail", enabled by `make env`): every email the users
  # service sends lands in the inbox at http://localhost:47025 (bound to this machine only).
  mailpit:
    image: axllent/mailpit:v1.27
    profiles: [mail]
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-47025}:8025"
    networks: [internal]
    restart: unless-stopped

  # Local LLM for the Coach (profile "ai", enabled by `make env`). Free and private: runs on this
  # machine's CPU, internal network only (no published port). The users service reaches it at
  # AI_BASE_URL=http://ollama:11434/v1 (OpenAI-compatible). ollama-pull downloads AI_MODEL once
  # into the ollama_data volume (about 1 GB for qwen2.5:1.5b).
  ollama:
    image: ollama/ollama:0.40.16
    profiles: [ai]
    environment:
      # keep the model in memory between questions (the first load takes a few seconds)
      OLLAMA_KEEP_ALIVE: 30m
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "ls"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]
    restart: unless-stopped

  ollama-pull:
    image: ollama/ollama:0.40.16
    profiles: [ai]
    entrypoint: ["ollama", "pull", "${AI_MODEL:-qwen2.5:1.5b}"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    networks: [internal]
    # a failed download (network down) is retried; a finished one exits 0 and stays stopped
    restart: on-failure

  # Cloudflare Tunnel (no domain or open ports needed; see docs/DEPLOY.md). Outbound only: it
  # connects to Cloudflare and forwards visitors to caddy:80 on the internal network.
  #   profile "quick-tunnel": a free random https://<name>.trycloudflare.com (changes on restart)
  #   profile "tunnel": a named tunnel from your Cloudflare account (CLOUDFLARE_TUNNEL_TOKEN), stable
  cloudflared-quick:
    image: cloudflare/cloudflared:2025.8.1
    profiles: [quick-tunnel]
    command: ["tunnel", "--no-autoupdate", "--protocol", "http2", "--url", "http://caddy:80"]
    depends_on:
      - caddy
    networks: [internal]
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:2025.8.1
    profiles: [tunnel]
    command: ["tunnel", "--no-autoupdate", "--protocol", "http2", "run"]
    environment:
      # read from the environment, not the command line (which `docker inspect` / ps would show)
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - caddy
    networks: [internal]
    restart: unless-stopped

  # Scheduled backups (database dump + uploaded avatars) into ../backups on the host.
  # Restore: make restore DB=db-<stamp>.dump [UPLOADS=uploads-<stamp>.tar.gz]
  backup:
    image: postgres:17-alpine
    entrypoint: ["/backup/loop.sh"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ft}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-ft}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-7}
    volumes:
      - ./backup:/backup:ro
      - ../backups:/backups
      - uploads:/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]
    restart: unless-stopped

  caddy:
    image: caddy:2.11-alpine
    # direct HTTPS (local CA or Let's Encrypt); docker-compose.tunnel.yml switches to Caddyfile.tunnel
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost:47443}
      TLS_MODE: ${TLS_MODE:-internal}
      HSTS_HEADER: ${HSTS_HEADER:--Strict-Transport-Security}
    ports:
      # HTTPS (47443 locally, 443 on a real domain) and HTTP for ACME challenges / redirects
      - "${HTTPS_PORT:-47443}:${CADDY_HTTPS_PORT:-47443}"
      - "${HTTP_PORT:-47080}:80"
    volumes:
      # the whole folder: Caddyfile / Caddyfile.tunnel both import routes.caddy
      - ./caddy:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_started
      users:
        condition: service_healthy
      game:
        condition: service_started
    networks: [internal]
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
  ollama_data:

networks:
  internal:
