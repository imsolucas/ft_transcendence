# ft_transcendence — one command: `make up` (docker compose -f infra/docker-compose.yml up -d --build)
# Browser origin: https://localhost:8443 (Caddy, automatic HTTPS). Only Caddy publishes a port.
name: ft_transcendence

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ft}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/.env}
      POSTGRES_DB: ${POSTGRES_DB:-ft}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [internal]
    restart: unless-stopped

  users:
    build:
      context: ..
      dockerfile: services/users/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ft}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ft}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-https://localhost:8443}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in infra/.env}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?set INTERNAL_SERVICE_TOKEN in infra/.env}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-ft_transcendence <no-reply@localhost>}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-5-5}
      SEED_DEV_DATA: ${SEED_DEV_DATA:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - uploads:/usr/src/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]
    restart: unless-stopped

  game:
    build:
      context: ..
      dockerfile: services/game/Dockerfile
    environment:
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-https://localhost:8443}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      USERS_API_URL: http://users:4000
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      users:
        condition: service_healthy
    networks: [internal]
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    depends_on:
      users:
        condition: service_healthy
    networks: [internal]
    restart: unless-stopped

  # Local mail catcher (profile "mail", enabled by `make env`): every email the users
  # service sends lands in the inbox at http://localhost:8025 (bound to this machine only).
  mailpit:
    image: axllent/mailpit:v1.27
    profiles: [mail]
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"
    networks: [internal]
    restart: unless-stopped

  # Scheduled backups (database dump + uploaded avatars) into ../backups on the host.
  # Restore: make restore DB=db-<stamp>.dump [UPLOADS=uploads-<stamp>.tar.gz]
  backup:
    image: postgres:17-alpine
    entrypoint: ["/backup/loop.sh"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ft}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-ft}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-7}
    volumes:
      - ./backup:/backup:ro
      - ../backups:/backups
      - uploads:/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]
    restart: unless-stopped

  caddy:
    image: caddy:2.11-alpine
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost:8443}
      TLS_MODE: ${TLS_MODE:-internal}
      HSTS_HEADER: ${HSTS_HEADER:--Strict-Transport-Security}
    ports:
      # HTTPS (8443 locally, 443 on a real domain) and HTTP for ACME challenges / redirects
      - "${HTTPS_PORT:-8443}:${CADDY_HTTPS_PORT:-8443}"
      - "${HTTP_PORT:-18080}:80"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_started
      users:
        condition: service_healthy
      game:
        condition: service_started
    networks: [internal]
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:

networks:
  internal:
