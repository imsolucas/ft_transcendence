services:
  frontend:
    container_name: frontend
    image: frontend
    build:
      context: ../services/frontend/
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ../services/frontend/:/usr/src/app/:rw
      - frontend_node_modules:/usr/src/app/node_modules/
    networks:
      - devnet

volumes:
  frontend_node_modules:

networks:
  devnet:
    driver: bridge
