services:
  frontend:
    container_name: frontend
    image: frontend
    build:
      context: ../services/frontend/
      dockerfile: Dockerfile
    command: ["${FRONTEND_CMD:-dev}"]
    ports:
      - "${FRONTEND_PORT}:${FRONTEND_PORT}"
    volumes:
      - ../services/frontend/:/usr/src/app/:rw
      - ../shared/:/usr/src/shared/
      - frontend_node_modules:/usr/src/app/node_modules/
    networks:
      - devnet
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS ${FRONTEND_HEALTH_HOST} || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  game:
    build:
      context: ../services/game/
      args: 
        PORT: ${GAME_PORT:-3001}
    image: game
    container_name: game
    command: ["${GAME_CMD:-dev}"]
    ports:
      - "${GAME_PORT:-3001}:${GAME_PORT:-3001}"
    networks:
      - devnet
    volumes:
      - ../services/game:/usr/src/app:rw
      - ../shared/:/usr/src/shared/:rw
      - game_node_modules:/usr/src/app/node_modules/
    restart: unless-stopped

volumes:
  frontend_node_modules:
  game_node_modules:

networks:
  devnet:
    driver: bridge
