services:
  frontend:
    container_name: frontend
    image: frontend
    build:
      context: ../services/frontend/
      dockerfile: Dockerfile
    command: ["${FRONTEND_CMD:-dev}"]
    ports:
      - "${FRONTEND_PORT}:${FRONTEND_PORT}"
    volumes:
      - ../services/frontend/:/usr/src/app/:rw
      - frontend_node_modules:/usr/src/app/node_modules/
    networks:
      - devnet
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS ${FRONTEND_HEALTH_HOST} || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: ../services/backend/
      args: 
        PORT: ${BACKEND_PORT:-3001}
    image: backend
    container_name: backend
    command: ["${BACKEND_CMD:-dev}"]
    ports:
      - "${BACKEND_PORT:-3001}:${BACKEND_PORT:-3001}"
    networks:
      - devnet
    volumes:
      - ../services/backend:/usr/src/app:rw
      - backend_node_modules:/usr/src/app/node_modules/
    restart: unless-stopped

volumes:
  frontend_node_modules:
  backend_node_modules:

networks:
  devnet:
    driver: bridge
