openapi: 3.1.0
info:
  title: User Management System
  version: 1.0.0

servers:
  - url: http://localhost:4000

paths:
  /auth/signup:
    post:
      summary: User signup
      description: Create a new user account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
                - password
              properties:
                name:
                  type: string
                  example: Alice
                email:
                  type: string
                  format: email
                  example: alice@example.com
                password:
                  type: string
                  format: password
                  example: SuperSecret123
      responses:
        '201':
          description: User created successfully.
        '400':
          description: Invalid input.
        '409':
          description: User name already exists or email already registered.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: User name already exists.
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/login:
    post:
      summary: User login
      description: Login to user account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - password
              properties:
                name:
                  type: string
                  example: Alice
                password:
                  type: string
                  format: password
                  example: SuperSecret123
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  user:
                    $ref: '#/components/schemas/UserProfile'
        '202':
          description: 2FA required
          content:
            application/json:
              schema:
                type: object
                properties:
                  twoFARequired:
                    type: boolean
                    example: true
                  userId:
                    type: integer
                    example: 1
        '401':
          description: Invalid username or password
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Invalid username or password
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/google:
    post:
      summary: Sign in or sign up with Google
      description: |
        Authenticates a user using a Google account. The frontend should send a Google ID token in the request body.
        If the user does not exist, a new account will be created. On success, returns an application JWT token and user profile.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - idToken
              properties:
                idToken:
                  type: string
                  example: "eyJhbGciOiJSUzI1NiIsImtpZCI6..."
      responses:
        '200':
          description: Google sign-in or sign-up successful.
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  user:
                    $ref: '#/components/schemas/UserProfile'
        '400':
          description: Invalid Google token.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Invalid Google token
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/verify-2fa:
    post:
      summary: Verify 2FA code
      description: Verifies the 2FA code and returns a JWT token if successful.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - userId
                - code
              properties:
                userId:
                  type: integer
                  example: 1
                code:
                  type: string
                  example: "123456"
      responses:
        '200':
          description: 2FA verification successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  user:
                    $ref: '#/components/schemas/UserProfile'
        '401':
          description: Invalid 2FA code
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Invalid 2FA code
        '500':
          $ref: '#/components/responses/InternalServerError'

  /user/2fa/setup:
    post:
      summary: Enable 2FA for user
      description: Generates a 2FA secret and returns a QR code for setup. The user must scan the QR code with an authenticator app and verify with a code.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 2FA setup info
          content:
            application/json:
              schema:
                type: object
                properties:
                  secret:
                    type: string
                    example: JBSWY3DPEHPK3PXP
                  qrCode:
                    type: string
                    format: uri
                    example: data:image/png;base64,...
        '400':
          description: 2FA is already enabled.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: 2FA is already enabled.
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /user/profile:
    get:
      summary: Get user profile
      description: Retrieves the profile information of the authenticated user.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User profile retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

    patch:
      summary: Update user profile
      description: |
        Updates the profile information of the authenticated user. This endpoint allows partial updates to user profile fields such as username, avatar, or other customizable attributes.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: Alice
                email:
                  type: string
                  format: email
                  example: alice@example.com
                avatar:
                  type: string
                  format: uri
                  example: https://example.com/avatar.png
      responses:
        '200':
          description: Profile updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '400':
          description: Invalid fields.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Invalid fields.
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /user/status:
    patch:
      summary: Update user status
      description: |
        Updates the status of the authenticated user. This endpoint allows the user to set their current status (e.g., ONLINE, OFFLINE, INGAME).
        The status can be used to indicate availability or activity within the application.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum:
                  - ONLINE
                  - OFFLINE
                  - INGAME
      responses:
        '200':
          description: User status updated successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - ONLINE
                      - OFFLINE
                      - INGAME
        '400':
          description: Invalid status value.
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /user/friends:
    get:
      summary: Get friend list
      description: Retrieves the friend list of the authenticated user.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Friend list retrieved successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    username:
                      type: string
                      example: Bob
                    avatar:
                      type: string
                      format: uri
                      example: https://example.com/avatar2.png
                    status:
                      type: string
                      enum:
                      - ONLINE
                      - OFFLINE
                      - INGAME
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /user/friend-request:
    post:
      summary: Send a friend request
      description: |
        Sends a friend request from the authenticated user to another user.
        The target user's identifier (such as username must be provided in the request body.)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  example: Bob
      responses:
        '201':
          description: Friend request sent successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FriendRequest'
        '400':
          description: Invalid input or already friends.
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: Target user not found.
        '409':
          description: Friend request already exists.
        '500':
          $ref: '#/components/responses/InternalServerError'

    get:
      summary: Retrieve friend requests
      description: |
        Retrieves the list of friend requests for the authenticated user.
        You can filter requests by direction using the `direction` query parameter (`sent` or `received`).
        - `sent`: Friend requests sent by the authenticated user.
        - `received`: Friend requests received by the authenticated user.
      security:
        - bearerAuth: []
      parameters:
        - name: direction
          in: query
          required: false
          schema:
            type: string
            enum: [sent, received]
          description: Filter by sent or received friend requests.
      responses:
        '200':
          description: Friend requests retrieved successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FriendRequest'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /user/friend-request/{requestId}:
    patch:
      summary: Accept or reject a friend request
      description: Update the status of a friend request (accept or reject).
      security:
        - bearerAuth: []
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum:
                    - ACCEPTED
                    - REJECTED
      responses:
        '200':
          description: Friend request updated successfully.
        '400':
          description: Invalid request.
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: Friend request not found.
        '500':
          $ref: '#/components/responses/InternalServerError'

  /user/match-history:
    get:
      summary: Retrieve match history of authenticated user
      description: |
        Retrieves the match history for the authenticated user.
        Returns a list of matches the user has participated in, including details such as opponent, scores, display names, start time and end time.
        If a match is part of a tournament, tournament details are included.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Match history retrieved successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                    - $ref: '#/components/schemas/MatchHistory'
                    - type: object
                      properties:
                        tournament:
                          type: ["object", "null"]
                          properties:
                            id:
                              type: integer
                              example: 5
                            name:
                              type: string
                              example: "Winter Cup"
                            winnerId:
                              type: integer
                              example: 1
                            start_at:
                              type: string
                              format: date-time
                              example: "2025-11-16T10:00:00Z"
                            end_at:
                              type: string
                              format: date-time
                              example: "2025-11-16T11:15:00Z"
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /game/match-result:
    post:
      summary: Upload match result
      description: |
        Uploads a completed match record from the Game service.
        The request should include both player IDs, scores, display names, and match timestamps.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - player1Id
                - player2Id
                - player1Score
                - player2Score
                - player1DisplayName
                - player2DisplayName
                - played_at
                - end_at
              properties:
                player1Id:
                  type: integer
                  example: 1
                player2Id:
                  type: integer
                  example: 2
                player1Score:
                  type: integer
                  example: 10
                player2Score:
                  type: integer
                  example: 8
                player1DisplayName:
                  type: string
                  example: Alice
                player2DisplayName:
                  type: string
                  example: Bob
                played_at:
                  type: string
                  format: date-time
                  example: "2025-11-06T10:30:00Z"
                end_at:
                  type: string
                  format: date-time
                  example: "2025-11-06T10:40:00Z"
      responses:
        '201':
          description: Match record created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchHistory'
        '400':
          description: Invalid input.
        '500':
          $ref: '#/components/responses/InternalServerError'

  /game/tournament-result:
    post:
      summary: Post tournament result
      description: |
        Creates a tournament record with all details after the tournament ends. The request must include tournament ID, name, winner ID, start/end times, players, and matches.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - tournamentId
                - winnerId
                - start_at
                - end_at
                - players
                - matches
              properties:
                tournamentId:
                  type: integer
                  example: 5
                name:
                  type: string
                  example: "Winter Cup"
                winnerId:
                  type: integer
                  example: 1
                start_at:
                  type: string
                  format: date-time
                  example: "2025-11-16T10:00:00Z"
                end_at:
                  type: string
                  format: date-time
                  example: "2025-11-16T11:15:00Z"
                players:
                  type: array
                  items:
                    type: object
                    required:
                      - userId
                    properties:
                      userId:
                        type: integer
                        example: 1
                matches:
                  type: array
                  items:
                    type: object
                    required:
                      - player1Id
                      - player2Id
                      - player1DisplayName
                      - player2DisplayName
                      - player1Score
                      - player2Score
                      - played_at
                      - end_at
                    properties:
                      player1Id:
                        type: integer
                        example: 1
                      player2Id:
                        type: integer
                        example: 2
                      player1DisplayName:
                        type: string
                        example: Alice
                      player2DisplayName:
                        type: string
                        example: Bob
                      player1Score:
                        type: integer
                        example: 5
                      player2Score:
                        type: integer
                        example: 3
                      winnerId:
                        type: ["integer", "null"]
                        example: 1
                      played_at:
                        type: string
                        format: date-time
                        example: "2025-11-16T10:30:00Z"
                      end_at:
                        type: string
                        format: date-time
                        example: "2025-11-16T10:40:00Z"
      responses:
        '200':
          description: Tournament result recorded successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  tournamentId:
                    type: integer
                    example: 5
                  winnerId:
                    type: integer
                    example: 1
                  start_at:
                    type: string
                    format: date-time
                    example: "2025-11-16T10:00:00Z"
                  end_at:
                    type: string
                    format: date-time
                    example: "2025-11-16T11:15:00Z"
                  players:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 1
                        tournamentId:
                          type: integer
                          example: 5
                        userId:
                          type: integer
                          example: 1
                  matches:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 101
                        tournamentId:
                          type: integer
                          example: 5
                        player1Id:
                          type: integer
                          example: 1
                        player2Id:
                          type: integer
                          example: 2
                        player1DisplayName:
                          type: string
                          example: Alice
                        player2DisplayName:
                          type: string
                          example: Bob
                        player1Score:
                          type: integer
                          example: 5
                        player2Score:
                          type: integer
                          example: 3
                        winnerId:
                          type: ["integer", "null"]
                          example: 1
                        played_at:
                          type: string
                          format: date-time
                          example: "2025-11-16T10:30:00Z"
                        end_at:
                          type: string
                          format: date-time
                          example: "2025-11-16T10:40:00Z"
        '400':
          description: Invalid input.
        '500':
          $ref: '#/components/responses/InternalServerError'

  /health:
    get:
      summary: Health check
      description: Returns the health status of the service. Useful for monitoring and orchestration tools to verify the service is running.
      responses:
        '200':
          description: Service is healthy.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    UserProfile:
      type: object
      properties:
        id: { type: integer, example: 1 }
        username: { type: string, example: Alice }
        email: { type: string, format: email, example: alice@example.com }
        avatar: { type: string, format: uri, example: https://example.com/avatar.png }

    FriendRequest:
      type: object
      properties:
        id: { type: integer, example: 1 }
        fromId: { type: integer, example: 1 }
        toId: { type: integer, example: 2 }
        status: { type: string, enum: [PENDING, ACCEPTED, REJECTED] }
        created_at: { type: string, format: date-time, example: "2025-11-06T10:30:00Z" }

    MatchHistory:
      type: object
      properties:
        matchId: { type: integer, example: 42 }
        tournamentId: { type: integer, example: 5 }
        player1Id: { type: integer, example: 1 }
        player2Id: { type: integer, example: 2 }
        player1DisplayName: { type: string, example: Alice }
        player2DisplayName: { type: string, example: Bob }
        player1Score: { type: integer, example: 10 }
        player2Score: { type: integer, example: 8 }
        winnerId: { type: integer, example: 1 }
        played_at: { type: string, format: date-time, example: "2025-11-06T10:30:00Z" }
        end_at: { type: string, format: date-time, example: "2025-11-06T10:40:00Z" }

  responses:
    UnauthorizedError:
      description: Unauthorized
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: Unauthorized

    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: Internal Server Error
