<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSocket Test</title>
</head>
<body>
    <h1>WebSocket Test Page</h1>

    <input type="text" id="playerName" placeholder="Enter your name">
    <button onclick="connect()">Connect to Server</button>
    <div id="status">Not Connected</div>

    <hr>
    <input type="text" id="roomId" placeholder="Room ID (leave blank to create)">
    <button onclick="joinGame()">Join/Create Game</button>

    <hr>
    <button id="readyButton" onclick="togglePlayerReady()">I'm Ready!</button>

    <script>
        let socket = null;
        let currentPlayer = null; // store player info after joining
        let isReady = false; // track ready state
        let connectionEstablished = false;

        function connect() {
            console.log('Starting connection...');

            const playerName = document.getElementById('playerName').value;
            if (!playerName) {
                console.log('Error: No Name');
                document.getElementById('status').textContent = "Provide a Name!";
                return;
            }

            // check if already connected
            if (socket && socket.readyState === WebSocket.OPEN) {
                console.log('Already connected!');
                return;
            }

            socket = new WebSocket('ws://localhost:3001/ws/game');
            console.log('WebSocket created, readyState:', socket.readyState);

            socket.onopen = function() {
                console.log('WebSocket opened successfully');

                // send connection request immediately
                const message = {
                    type: "connection",
                    data: { playerName: playerName },
                    timestamp: Date.now()
                };
                socket.send(JSON.stringify(message));

                console.log('Sent connection request for', playerName);
                document.getElementById('status').textContent = "Connected!";
                connectionEstablished = true;
            };

            socket.onmessage = function(event) {
                console.log('Message from server:', event.data);

                // parse and handle different message types
                try {
                    const message = JSON.parse(event.data);
                    if (message.type === 'connectionSuccess') {
                        // store player info when successfully joined
                        currentPlayer = {
                            name: document.getElementById('playerName').value,
                            id: message.data.playerId,
                        };
                        console.log('Player registered:', currentPlayer);
                    } else if (message.type === 'playerJoined') {
                        // Room join confirmation
                        currentPlayer.roomId = message.data.roomId;
                        currentPlayer.position = message.data.position;
                        console.log('Joined room:', currentPlayer.roomId, 'as position', currentPlayer.position);
                    }
                } catch (error) {
                    console.log('Could not parse message:', error);
                }
            };

            socket.onclose = function(event) {
                console.log('WebSocket closed. Code:', event.code, 'Reason:', event.reason);
                document.getElementById('status').textContent = "Disconnected.";
                console.log('Disconnected from server');
                connectionEstablished = false;
                socket = null;
            };

            socket.onerror = function(error) {
                console.log('WebSocket error:', error);
                document.getElementById('status').textContent = "Connection Failed!";
                console.log('Connection error:', error);
            };
        }

        function joinGame() {
            if (!socket || socket.readyState !== WebSocket.OPEN) {
                console.log('Not connected to server!');
                return;
            }
            if (!connectionEstablished) {
                console.log('Player not registered yet!');
                return;
            }
            const roomId = document.getElementById('roomId').value.substring(0, 8);
            let message;
            if (roomId) {
                // Join existing room
                message = {
                    type: "joinRoom",
                    data: { roomId: roomId, playerId: currentPlayer.id },
                    timestamp: Date.now()
                };
                console.log('HTML requesting to join room:', roomId);
            } else {
                // Create new room
                message = {
                    type: "createRoom",
                    data: { playerId: currentPlayer.id },
                    timestamp: Date.now()
                };
                console.log('HTML requesting to create new room');
            }
            socket.send(JSON.stringify(message));
        }

        function togglePlayerReady() {
            if (!socket || socket.readyState !== WebSocket.OPEN) {
                console.log('Not connected to server!');
                return;
            }
            if (!currentPlayer) {
                console.log('No Player Object Detected')
                return;
            }
            else if (!currentPlayer.roomId){
                console.log('Need to join a game/room first!');
                return;
            }
            console.log('Player changing ready status...');

            // toggle ready state
            isReady = !isReady;
            const message = {
                type: "playerReady",
                data: {
                    playerName: currentPlayer.name,
                    playerId: currentPlayer.id,
                    roomId: currentPlayer.roomId,
                    ready: isReady
                },
                timestamp: Date.now()
            };
            socket.send(JSON.stringify(message));
            const readyButton = document.getElementById('readyButton');
            if (isReady) {
                readyButton.textContent = 'Cancel Ready';
                console.log(currentPlayer.name, 'is ready!');
            } else {
                readyButton.textContent = 'I\'m Ready!';
                console.log(currentPlayer.name, 'is not ready');
            }
        }
    </script>
</body>
</html>
