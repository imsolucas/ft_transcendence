worker_processes 1;

events {
    worker_connections 1024;
}

http {
    server_tokens off;
    client_max_body_size 2m;

    # Map for WebSocket upgrade header
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Brute-force damping for login / signup / 2FA / refresh (the users service also
    # rate limits per route; this protects it before requests reach Node).
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;
    limit_req_status 429;

    server {
        listen 443 ssl;
        server_name localhost;

        ssl_certificate /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Security headers (inherited by every location that doesn't set its own add_header).
        # HSTS is deliberately NOT sent: on "localhost" Chrome would apply it to every port
        # and break other plain-http dev servers. Enable it once served on a real domain:
        # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        # A Content-Security-Policy is added with the Next.js frontend (Phase 1).
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # Internal service-to-service routes are never reachable from outside
        location ~ ^/game/(match-result|tournament-result)$ {
            return 404;
        }

        # Proxy auth API requests to the users service (must come before / location)
        # Match /auth/ followed by at least one character (like /auth/login, /auth/signup, etc.)
        # This ensures /auth (frontend route) is not caught by this block
        location ~ ^/auth/.+ {
            limit_req zone=auth burst=20 nodelay;
            proxy_pass http://users:4000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Proxy frontend requests (catch-all, must be last)
        # This also handles Vite HMR WebSocket connections
        location / {
            proxy_pass http://frontend:3000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Enable WebSocket support for Vite HMR
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 86400;
        }

        # Proxy user requests to the users service
        location /user/ {
            proxy_pass http://users:4000/user/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Proxy public API requests to the users service
        location /api/public/ {
            proxy_pass http://users:4000/api/public/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Forward API key header
            proxy_set_header X-API-Key $http_x_api_key;
        }

        # Proxy WebSocket connections for the Game service
        location = /ws/game {
            proxy_pass http://game:3001/ws/game;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400;
        }

        # # Proxy Swagger UI (API docs) to the users service
        # location /users/docs/ {
        #     proxy_pass http://users:4000/docs/;
        #     proxy_set_header Host $host;
        #     proxy_set_header X-Real-IP $remote_addr;
        #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        #     proxy_set_header X-Forwarded-Proto $scheme;
        # }

        # # Proxy Swagger UI auth requests to the users service
        # location /users/auth/ {
        #     proxy_pass http://users:4000/auth/;
        #     proxy_set_header Host $host;
        #     proxy_set_header X-Real-IP $remote_addr;
        #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        #     proxy_set_header X-Forwarded-Proto $scheme;
        # }

        # # Proxy Swagger UI user requests to the users service
        # location /users/user/ {
        #     proxy_pass http://users:4000/user/;
        #     proxy_set_header Host $host;
        #     proxy_set_header X-Real-IP $remote_addr;
        #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        #     proxy_set_header X-Forwarded-Proto $scheme;
        # }

        # # Proxy Swager UI game result endpoints to users service
        # location = /users/game/match-result {
