<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSocket Queue Test</title>
    <style>
        body {
            font-family: monospace;
            padding: 20px;
            background: #1a1a1a;
            color: #00ff00;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        button {
            padding: 10px 20px;
            margin: 5px;
            background: #333;
            color: #00ff00;
            border: 1px solid #00ff00;
            cursor: pointer;
            font-family: monospace;
        }
        button:hover {
            background: #00ff00;
            color: #000;
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .log {
            background: #000;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #00ff00;
            height: 300px;
            overflow-y: auto;
        }
        .log-entry {
            margin: 5px 0;
            word-wrap: break-word;
        }
        .sent {
            color: #ffff00;
        }
        .received {
            color: #00ffff;
        }
        .error {
            color: #ff0000;
        }
        .input-group {
            margin: 10px 0;
        }
        input {
            padding: 5px;
            background: #000;
            color: #00ff00;
            border: 1px solid #00ff00;
            font-family: monospace;
        }
        .status {
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #00ff00;
        }
        .connected {
            border-color: #00ff00;
        }
        .disconnected {
            border-color: #ff0000;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 WebSocket Queue Test</h1>

        <div class="input-group">
            <label>WebSocket URL: </label>
            <input type="text" id="wsUrl" value="ws://localhost:3001/ws/game" style="width: 300px;">
        </div>

        <div class="input-group">
            <label>Player ID: </label>
            <input type="text" id="playerId" value="test-player-1" style="width: 200px;">
        </div>

        <div class="input-group">
            <label>Player Name: </label>
            <input type="text" id="playerName" value="TestPlayer1" style="width: 200px;">
        </div>

        <div class="status" id="status">
            Status: <span id="statusText">Disconnected</span>
        </div>

        <div>
            <h3>Connection</h3>
            <button onclick="connect()">Connect</button>
            <button onclick="disconnect()">Disconnect</button>
        </div>

        <div>
            <h3>Queue Actions</h3>
            <button onclick="joinStandardQueue()">Join Standard Queue</button>
            <button onclick="joinTournamentQueue()">Join Tournament Queue</button>
            <button onclick="leaveQueue()">Leave Queue</button>
        </div>

        <div>
            <h3>Room Actions</h3>
            <button onclick="playerReady()">Player Ready</button>
            <button onclick="leaveRoom()">Leave Room</button>
        </div>

        <div>
            <h3>Message Log</h3>
            <button onclick="clearLog()">Clear Log</button>
            <div class="log" id="log"></div>
        </div>
    </div>

    <script>
        let ws = null;

        function log(message, type = 'info') {
            const logDiv = document.getElementById('log');
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logDiv.appendChild(entry);
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function updateStatus(connected) {
            const statusDiv = document.getElementById('status');
            const statusText = document.getElementById('statusText');

            if (connected) {
                statusDiv.className = 'status connected';
                statusText.textContent = 'Connected';
            } else {
                statusDiv.className = 'status disconnected';
                statusText.textContent = 'Disconnected';
            }
        }

        function connect() {
            const url = document.getElementById('wsUrl').value;
            const playerId = document.getElementById('playerId').value;
            const playerName = document.getElementById('playerName').value;

            if (ws && ws.readyState === WebSocket.OPEN) {
                log('Already connected!', 'error');
                return;
            }

            log(`Connecting to ${url}...`, 'info');
            ws = new WebSocket(url);

            ws.onopen = () => {
                log('WebSocket connected!', 'info');
                updateStatus(true);

                // Send connection message
                const connectionMsg = {
                    type: 'connection',
                    data: {
                        playerId: playerId,
                        playerName: playerName,
                        picture: 'https://via.placeholder.com/150'
                    },
                    timestamp: Date.now()
                };

                ws.send(JSON.stringify(connectionMsg));
                log(`SENT: ${JSON.stringify(connectionMsg, null, 2)}`, 'sent');
            };

            ws.onmessage = (event) => {
                log(`RECEIVED: ${event.data}`, 'received');
                try {
                    const message = JSON.parse(event.data);
                    log(`Parsed: ${JSON.stringify(message, null, 2)}`, 'received');
                } catch (e) {
                    log(`Failed to parse message: ${e.message}`, 'error');
                }
            };

            ws.onerror = (error) => {
                log(`WebSocket error: ${error}`, 'error');
            };

            ws.onclose = () => {
                log('WebSocket disconnected', 'info');
                updateStatus(false);
            };
        }

        function disconnect() {
            if (ws) {
                ws.close();
                ws = null;
            }
        }

        function sendMessage(message) {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                log('Not connected!', 'error');
                return;
            }

            const msg = JSON.stringify(message);
            ws.send(msg);
            log(`SENT: ${JSON.stringify(message, null, 2)}`, 'sent');
        }

        function joinStandardQueue() {
            const message = {
                type: 'joinQueue',
                data: {
                    roomType: 'standard'
                },
                timestamp: Date.now()
            };
            sendMessage(message);
        }

        function joinTournamentQueue() {
            const message = {
                type: 'joinQueue',
                data: {
                    roomType: 'tournament'
                },
                timestamp: Date.now()
            };
            sendMessage(message);
        }

        function leaveQueue() {
            const playerId = document.getElementById('playerId').value;
            const playerName = document.getElementById('playerName').value;

            const message = {
                type: 'leaveQueue',
                data: {
                    playerName: playerName
                },
                timestamp: Date.now()
            };
            sendMessage(message);
        }

        function playerReady() {
            const playerId = document.getElementById('playerId').value;
            const playerName = document.getElementById('playerName').value;

            const message = {
                type: 'playerReady',
                data: {
                    playerId: playerId,
                    playerName: playerName,
                    ready: true
                },
                timestamp: Date.now()
            };
            sendMessage(message);
        }

        function leaveRoom() {
            const playerName = document.getElementById('playerName').value;

            const message = {
                type: 'leaveRoom',
                data: {
                    playerName: playerName
                },
                timestamp: Date.now()
            };
            sendMessage(message);
        }

        function clearLog() {
            document.getElementById('log').innerHTML = '';
        }

        // Update status on load
        updateStatus(false);
    </script>
</body>
</html>
