<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSocket Queue Test</title>
    <style>
        body {
            font-family: monospace;
            padding: 20px;
            background: #1a1a1a;
            color: #00ff00;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        button {
            padding: 10px 20px;
            margin: 5px;
            background: #333;
            color: #00ff00;
            border: 1px solid #00ff00;
            cursor: pointer;
            font-family: monospace;
        }
        button:hover {
            background: #00ff00;
            color: #000;
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .log {
            background: #000;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #00ff00;
            height: 400px;
            overflow-y: auto;
            font-size: 11px;
        }
        .log-entry {
            margin: 2px 0;
            word-wrap: break-word;
            font-size: 11px;
        }
        .sent {
            color: #ffff00;
        }
        .received {
            color: #00ffff;
        }
        .error {
            color: #ff0000;
        }
        .info {
            color: #00ff00;
        }
        .input-log {
            color: #888;
            font-size: 10px;
        }
        .game-state {
            background: #000;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #00ff00;
            color: #00ff00;
        }
        .controls {
            background: #222;
            padding: 15px;
            margin: 10px 0;
            border: 2px solid #00ff00;
        }
        .controls h3 {
            margin-top: 0;
        }
        .key-hint {
            display: inline-block;
            background: #000;
            border: 1px solid #00ff00;
            padding: 5px 10px;
            margin: 5px;
            font-weight: bold;
        }
        .input-group {
            margin: 10px 0;
        }
        input {
            padding: 5px;
            background: #000;
            color: #00ff00;
            border: 1px solid #00ff00;
            font-family: monospace;
        }
        .status {
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #00ff00;
        }
        .connected {
            border-color: #00ff00;
        }
        .disconnected {
            border-color: #ff0000;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 WebSocket Queue Test</h1>

        <div class="input-group">
            <label>WebSocket URL: </label>
            <input type="text" id="wsUrl" value="ws://localhost:3001/ws/game" style="width: 300px;">
        </div>

        <div class="input-group">
            <label>Player ID: </label>
            <input type="text" id="playerId" value="test-player-1" style="width: 200px;">
        </div>

        <div class="input-group">
            <label>Player Name: </label>
            <input type="text" id="playerName" value="TestPlayer1" style="width: 200px;">
        </div>

        <div class="status" id="status">
            Status: <span id="statusText">Disconnected</span>
        </div>

        <div>
            <h3>Connection</h3>
            <button onclick="connect()">Connect</button>
            <button onclick="disconnect()">Disconnect</button>
        </div>

        <div>
            <h3>Queue Actions</h3>
            <button onclick="joinStandardQueue()">Join Standard Queue</button>
            <button onclick="joinTournamentQueue()">Join Tournament Queue</button>
            <button onclick="leaveQueue()">Leave Queue</button>
        </div>

        <div>
            <h3>Room Actions</h3>
            <button onclick="playerReady()">Player Ready</button>
            <button onclick="leaveRoom()">Leave Room</button>
        </div>

        <div class="controls">
            <h3>🎮 Game Controls</h3>
            <p>Use keyboard when game starts:</p>
            <span class="key-hint">W</span> Move Up
            <span class="key-hint">S</span> Move Down
            <br><br>
            <label>
                <input type="checkbox" id="quietMode" onchange="toggleQuietMode()">
                Quiet Mode (Hide input spam)
            </label>
        </div>

        <div class="game-state">
            <h3>Game Status</h3>
            <div id="gameStatus">Not in game</div>
        </div>

        <div>
            <h3>Message Log</h3>
            <button onclick="clearLog()">Clear Log</button>
            <button onclick="pauseLog()">Pause/Resume</button>
            <div class="log" id="log"></div>
        </div>
    </div>

    <script>
        let ws = null;
        let quietMode = false;
        let logPaused = false;

        function log(message, type = 'info') {
            if (logPaused) return;

            // Skip input logs in quiet mode
            if (quietMode && type === 'input-log') return;

            const logDiv = document.getElementById('log');
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logDiv.appendChild(entry);

            // Keep only last 100 entries to prevent lag
            while (logDiv.children.length > 100) {
                logDiv.removeChild(logDiv.firstChild);
            }

            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function toggleQuietMode() {
            quietMode = document.getElementById('quietMode').checked;
            log(quietMode ? 'Quiet mode ON - hiding input spam' : 'Quiet mode OFF', 'info');
        }

        function pauseLog() {
            logPaused = !logPaused;
            log(logPaused ? 'Log PAUSED' : 'Log RESUMED', 'info');
        }

        function updateStatus(connected) {
            const statusDiv = document.getElementById('status');
            const statusText = document.getElementById('statusText');

            if (connected) {
                statusDiv.className = 'status connected';
                statusText.textContent = 'Connected';
            } else {
                statusDiv.className = 'status disconnected';
                statusText.textContent = 'Disconnected';
            }
        }

        function connect() {
            const url = document.getElementById('wsUrl').value;
            const playerId = document.getElementById('playerId').value;
            const playerName = document.getElementById('playerName').value;

            if (ws && ws.readyState === WebSocket.OPEN) {
                log('Already connected!', 'error');
                return;
            }

            log(`Connecting to ${url}...`, 'info');
            ws = new WebSocket(url);

            ws.onopen = () => {
                log('WebSocket connected!', 'info');
                updateStatus(true);

                // Send connection message
                const connectionMsg = {
                    type: 'connection',
                    data: {
                        playerId: playerId,
                        playerName: playerName,
                        picture: 'https://via.placeholder.com/150'
                    },
                    timestamp: Date.now()
                };

                ws.send(JSON.stringify(connectionMsg));
                log(`SENT: ${JSON.stringify(connectionMsg, null, 2)}`, 'sent');
            };

            ws.onmessage = (event) => {
                try {
                    const message = JSON.parse(event.data);

                    // Update game status
                    if (message.type === 'gameStart') {
                        document.getElementById('gameStatus').innerHTML = '<span style="color:#0f0">🎮 GAME STARTED - Use W/S to move!</span>';
                    } else if (message.type === 'gameEnd' || message.type === 'tournamentEnd') {
                        document.getElementById('gameStatus').innerHTML = '<span style="color:#f00">🏁 Game Ended</span>';
                    } else if (message.type === 'tournamentRoundEnd') {
                        document.getElementById('gameStatus').innerHTML = '<span style="color:#ff0">⏸️ Round Ended - Next round starting...</span>';
                    } else if (message.type === 'playerJoined') {
                        document.getElementById('gameStatus').innerHTML = '<span style="color:#0ff">👥 In Room - Waiting for ready...</span>';
                    }

                    // Only log important messages
                    if (message.type !== 'gameState') {
                        log(`📥 ${message.type}`, 'received');
                        if (!quietMode) {
                            log(`   ${JSON.stringify(message.data, null, 2)}`, 'received');
                        }
                    }
                } catch (e) {
                    log(`Failed to parse: ${e.message}`, 'error');
                }
            };

            ws.onerror = (error) => {
                log(`WebSocket error: ${error}`, 'error');
            };

            ws.onclose = () => {
                log('WebSocket disconnected', 'info');
                updateStatus(false);
            };
        }

        function disconnect() {
            if (ws) {
                ws.close();
                ws = null;
            }
        }

        function sendMessage(message) {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                log('Not connected!', 'error');
                return;
            }

            const msg = JSON.stringify(message);
            ws.send(msg);
            log(`SENT: ${JSON.stringify(message, null, 2)}`, 'sent');
        }

        function joinStandardQueue() {
            const message = {
                type: 'joinQueue',
                data: {
                    roomType: 'standard'
                },
                timestamp: Date.now()
            };
            sendMessage(message);
        }

        function joinTournamentQueue() {
            const message = {
                type: 'joinQueue',
                data: {
                    roomType: 'tournament'
                },
                timestamp: Date.now()
            };
            sendMessage(message);
        }

        function leaveQueue() {
            const playerId = document.getElementById('playerId').value;
            const playerName = document.getElementById('playerName').value;

            const message = {
                type: 'leaveQueue',
                data: {
                    playerName: playerName
                },
                timestamp: Date.now()
            };
            sendMessage(message);
        }

        function playerReady() {
            const playerId = document.getElementById('playerId').value;
            const playerName = document.getElementById('playerName').value;

            const message = {
                type: 'playerReady',
                data: {
                    playerId: playerId,
                    playerName: playerName,
                    ready: true
                },
                timestamp: Date.now()
            };
            sendMessage(message);
        }

        function leaveRoom() {
            const playerName = document.getElementById('playerName').value;

            const message = {
                type: 'leaveRoom',
                data: {
                    playerName: playerName
                },
                timestamp: Date.now()
            };
            sendMessage(message);
        }

        function clearLog() {
            document.getElementById('log').innerHTML = '';
        }

        // Keyboard input for game controls
        let currentInputs = {
            up: false,
            down: false,
            left: false,
            right: false,
            action_1: false,
            action_2: false
        };

        function sendPlayerInput() {
            if (!ws || ws.readyState !== WebSocket.OPEN) return;

            const message = {
                type: 'playerInput',
                data: {
                    inputs: {...currentInputs}
                },
                timestamp: Date.now()
            };
            ws.send(JSON.stringify(message));
        }

        document.addEventListener('keydown', (event) => {
            let changed = false;
            if (event.key === 'w' || event.key === 'W') {
                if (!currentInputs.up) {
                    currentInputs.up = true;
                    changed = true;
                    log('⬆️ UP', 'input-log');
                }
            } else if (event.key === 's' || event.key === 'S') {
                if (!currentInputs.down) {
                    currentInputs.down = true;
                    changed = true;
                    log('⬇️ DOWN', 'input-log');
                }
            }
            if (changed) sendPlayerInput();
        });

        document.addEventListener('keyup', (event) => {
            let changed = false;
            if (event.key === 'w' || event.key === 'W') {
                if (currentInputs.up) {
                    currentInputs.up = false;
                    changed = true;
                    log('⬆️ Stop', 'input-log');
                }
            } else if (event.key === 's' || event.key === 'S') {
                if (currentInputs.down) {
                    currentInputs.down = false;
                    changed = true;
                    log('⬇️ Stop', 'input-log');
                }
            }
            if (changed) sendPlayerInput();
        });

        // Update status on load
        updateStatus(false);
    </script>
</body>
</html>
